name: Pipeline Health Check

on:
  # This makes it run every 15 minutes
  schedule:
    - cron: '*/15 * * * *'
  # This allows you to run it manually from the GitHub UI
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run Monitor
        run: python monitor.py